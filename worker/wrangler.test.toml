# Test mailing-list Worker on the band's Cloudflare account, workers.dev only
# (no route on pinkladyslipper.net). Used by DEV (GitHub Pages) and localhost.
#
# Deploy from this folder (never the repo root: PROD's build runs
# `wrangler deploy` there):
#   export CLOUDFLARE_API_TOKEN=$(cat ~/.config/cloudflare-pls-prod/token)
#   export CLOUDFLARE_ACCOUNT_ID=feaccfb4bfda7d10bd645e2d95928d51
#   npx wrangler deploy --config wrangler.test.toml
#   npx wrangler secret put ADMIN_PASSWORD --config wrangler.test.toml

name = "pls-list-test"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

kv_namespaces = [
  { binding = "LIST", id = "69dd6f49561d4f30aad2da569063478e" },
]

[vars]
SITE_NAME = "Pink Lady Slipper (TEST)"
ALLOWED_ORIGINS = "https://shankardba.github.io,http://localhost:8997,http://127.0.0.1:8997"
UNSUBSCRIBE_URL = "pinkladyslipper.net/unsubscribe"
